name: CI

on:
  workflow_call:
  push:
    branches:
      - main
      - release-*
  pull_request:
    branches:
      - main
      - release-*

permissions:
  contents: read

concurrency:
  # Keep this distinct from the caller's release concurrency group when CI is
  # invoked as a reusable release preflight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate .asf.yaml
        run: pip install pyyaml -q && python3 tools/validate_asf_yaml.py

      - name: Check ASF license headers
        run: python3 tools/check_license_headers.py

      - name: Test release tooling
        run: |
          python3 -m pip install pytest==8.4.2
          python3 -m pytest -q tools/tests

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.0

      - name: Install cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.1

      - name: Check dependency licenses and generated reports
        run: python3 tools/dependencies.py check

      - name: Check Rust security advisories
        run: cargo deny --locked check advisories

      - name: Verify artifact-exact license reports
        run: |
          cargo fetch --locked
          python3 tools/generate_license_reports.py --check

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --workspace --locked -- -D warnings

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: cargo build --all-targets --locked

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage
        run: cargo llvm-cov --locked --summary-only -- --skip test_read_java_written_file --skip test_read_python_written_file

  cpp-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Arrow C++
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-transport-https lsb-release ca-certificates curl
          curl -fsSL https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb -o /tmp/arrow-apt.deb
          sudo apt-get install -y /tmp/arrow-apt.deb
          sudo apt-get update
          sudo apt-get install -y libarrow-dev

      - name: Build FFI library
        run: cargo build --release --locked -p paimon-mosaic-ffi

      - name: Build C++ test
        run: |
          cmake -S cpp -B cpp/build \
            -DMOSAIC_FFI_LIB=${{ github.workspace }}/target/release/libpaimon_mosaic_ffi.so
          cmake --build cpp/build

      - name: Run C++ test
        run: cpp/build/test_mosaic
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/target/release

  java-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'

      - name: Build JNI library
        run: cargo build -p paimon-mosaic-jni --release --locked

      - name: Write interop files (Rust)
        run: cargo test --release --locked -p paimon-mosaic-core --test interop_write_test

      - name: Run Java tests
        working-directory: java
        run: mvn test "-DargLine=-Djava.library.path=${{ github.workspace }}/target/release"

      - name: Read Java-written interop file (Rust)
        run: cargo test --release --locked -p paimon-mosaic-core --test interop_read_test test_read_java_written_file

      - name: Verify Java classifier licensing
        run: |
          mvn -q -f java/pom.xml clean verify -Prelease -Dgpg.skip=true -DskipTests
          main_jar="$(find java/target -maxdepth 1 -type f \
            -name 'mosaic-*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          sources_jar="$(find java/target -maxdepth 1 -type f \
            -name 'mosaic-*-sources.jar' -print -quit)"
          javadoc_jar="$(find java/target -maxdepth 1 -type f \
            -name 'mosaic-*-javadoc.jar' -print -quit)"
          test -n "$main_jar" && test -n "$sources_jar" && test -n "$javadoc_jar"
          python3 tools/verify_java_jars.py \
            --main "$main_jar" \
            --sources "$sources_jar" \
            --javadoc "$javadoc_jar"

  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Rust Cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build FFI library
        run: cargo build --release --locked -p paimon-mosaic-ffi

      - name: Write interop files (Rust)
        run: cargo test --release --locked -p paimon-mosaic-core --test interop_write_test

      - name: Install Python dependencies
        working-directory: python
        run: pip install pyarrow pytest

      - name: Run Python tests
        working-directory: python
        run: pytest -v
        env:
          MOSAIC_LIB_PATH: ${{ github.workspace }}/target/release

      - name: Read Python-written interop file (Rust)
        run: cargo test --release --locked -p paimon-mosaic-core --test interop_read_test test_read_python_written_file
