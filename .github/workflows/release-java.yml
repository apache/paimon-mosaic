name: Release Java

on:
  workflow_call:
  workflow_dispatch:

env:
  JDK_VERSION: 8

concurrency:
  group: release-java-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-preflight:
    uses: ./.github/workflows/release-preflight.yml

  build-native:
    needs: [release-preflight]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            os_name: linux
            arch: x86_64
            lib_name: libpaimon_mosaic_jni.so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            os_name: linux
            arch: aarch64
            lib_name: libpaimon_mosaic_jni.so
          - os: macos-latest
            target: aarch64-apple-darwin
            os_name: macos
            arch: aarch64
            lib_name: libpaimon_mosaic_jni.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            os_name: windows
            arch: x86_64
            lib_name: paimon_mosaic_jni.dll
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Setup Python
        if: matrix.os_name == 'linux'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Linux zigbuild
        if: matrix.os_name == 'linux'
        run: pip install cargo-zigbuild

      - name: Build Linux JNI library
        if: matrix.os_name == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          rustup target add "${{ matrix.target }}"
          unset ZSTD_SYS_USE_PKG_CONFIG

          cargo zigbuild --release -p paimon-mosaic-jni --target "${{ matrix.target }}.2.17"

          artifact="target/${{ matrix.target }}/release/${{ matrix.lib_name }}"
          test -f "$artifact"

          version_info="$(readelf --version-info "$artifact")"
          max_glibc="$(
            printf '%s\n' "$version_info" \
              | grep -Eo 'GLIBC_[0-9][0-9.]*' \
              | sort -Vu \
              | tail -n1 \
              || true
          )"
          echo "Maximum required GLIBC version: ${max_glibc:-none}"

          if [[ -n "$max_glibc" ]]; then
            allowed_glibc="GLIBC_2.17"
            highest_glibc="$(printf '%s\n%s\n' "$allowed_glibc" "$max_glibc" | sort -Vu | tail -n1)"
            if [[ "$highest_glibc" != "$allowed_glibc" ]]; then
              echo "Linux GNU artifact requires $max_glibc, expected <= $allowed_glibc" >&2
              exit 1
            fi
          fi

      - name: Build JNI library
        if: matrix.os_name != 'linux'
        run: |
          rustup target add "${{ matrix.target }}"
          cargo build --release -p paimon-mosaic-jni --target "${{ matrix.target }}"

      - name: Upload native library
        uses: actions/upload-artifact@v5
        with:
          name: native-${{ matrix.os_name }}-${{ matrix.arch }}
          path: target/${{ matrix.target }}/release/${{ matrix.lib_name }}

  package-java:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.repository == 'apache/paimon-mosaic' &&
      startsWith(github.ref, 'refs/tags/') &&
      contains(github.ref_name, '-rc')
    runs-on: ubuntu-latest
    needs: [release-preflight, build-native]
    steps:
      - uses: actions/checkout@v6

      - name: Download linux x86_64 native library
        uses: actions/download-artifact@v5
        with:
          name: native-linux-x86_64
          path: java/src/main/resources/native/linux/x86_64

      - name: Download linux aarch64 native library
        uses: actions/download-artifact@v5
        with:
          name: native-linux-aarch64
          path: java/src/main/resources/native/linux/aarch64

      - name: Download macOS aarch64 native library
        uses: actions/download-artifact@v5
        with:
          name: native-macos-aarch64
          path: java/src/main/resources/native/macos/aarch64

      - name: Download windows x86_64 native library
        uses: actions/download-artifact@v5
        with:
          name: native-windows-x86_64
          path: java/src/main/resources/native/windows/x86_64

      - name: Verify native libraries
        run: find java/src/main/resources/native -type f | sort

      - name: Set up JDK ${{ env.JDK_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JDK_VERSION }}
          distribution: 'temurin'
          cache: maven

      - name: Show Maven version
        run: mvn --version

      - name: Package Java artifacts
        working-directory: java
        run: mvn clean verify -Prelease -Dgpg.skip=true -DskipTests

      - name: Verify multi-platform Java package
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's#.*<version>\([^<]*\)</version>.*#\1#p' java/pom.xml | sed -n '2p')"
          jar_file="java/target/mosaic-${version}.jar"
          sources_jar="java/target/mosaic-${version}-sources.jar"
          javadoc_jar="java/target/mosaic-${version}-javadoc.jar"

          for artifact in "$jar_file" "$sources_jar" "$javadoc_jar"; do
            test -s "$artifact"
          done

          if jar tf "$sources_jar" | grep -Eq '^native/'; then
            echo "Sources JAR contains native resources" >&2
            exit 1
          fi

          for entry in \
            org/apache/paimon/mosaic/NativeLib.class \
            native/linux/x86_64/libpaimon_mosaic_jni.so \
            native/linux/aarch64/libpaimon_mosaic_jni.so \
            native/macos/aarch64/libpaimon_mosaic_jni.dylib \
            native/windows/x86_64/paimon_mosaic_jni.dll \
            META-INF/LICENSE \
            META-INF/NOTICE \
            META-INF/DEPENDENCIES \
            META-INF/licenses/x86_64-unknown-linux-gnu/THIRD-PARTY-LICENSES.html \
            META-INF/licenses/aarch64-unknown-linux-gnu/THIRD-PARTY-LICENSES.html \
            META-INF/licenses/aarch64-apple-darwin/THIRD-PARTY-LICENSES.html \
            META-INF/licenses/x86_64-pc-windows-msvc/THIRD-PARTY-LICENSES.html
          do
            jar tf "$jar_file" | grep -qx "$entry"
          done

          python3 tools/verify_release_artifacts.py java "$jar_file"

          java -cp "$jar_file:java/target/test-classes" \
            org.apache.paimon.mosaic.MosaicNativeLoaderSmokeTest

      - name: Upload Java package
        uses: actions/upload-artifact@v5
        with:
          name: java-package
          path: java/target/*.jar
          if-no-files-found: error

  smoke-java-package:
    if: >-
      github.event_name != 'workflow_dispatch' &&
      github.repository == 'apache/paimon-mosaic' &&
      startsWith(github.ref, 'refs/tags/') &&
      contains(github.ref_name, '-rc')
    needs: [release-preflight, package-java]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            classpath_separator: ':'
            java_version: 8
          - os: ubuntu-24.04-arm
            classpath_separator: ':'
            java_version: 8
          # Temurin does not provide JDK 8 for GitHub's macOS arm64 runners.
          - os: macos-latest
            classpath_separator: ':'
            java_version: 17
          - os: windows-latest
            classpath_separator: ';'
            java_version: 8
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ matrix.java_version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java_version }}
          distribution: 'temurin'

      - name: Download final Java package
        uses: actions/download-artifact@v5
        with:
          name: java-package
          path: java-package

      - name: Load the bundled JNI library from the final JAR
        shell: bash
        run: |
          set -euo pipefail
          jar_file="$(
            find java-package -type f -name '*.jar' \
              ! -name '*-sources.jar' \
              ! -name '*-javadoc.jar' \
              -print -quit
          )"
          test -n "$jar_file"
          mkdir -p smoke-classes
          javac -cp "$jar_file" -d smoke-classes \
            java/src/test/java/org/apache/paimon/mosaic/MosaicNativeLoaderSmokeTest.java
          java -cp "$jar_file${{ matrix.classpath_separator }}smoke-classes" \
            org.apache.paimon.mosaic.MosaicNativeLoaderSmokeTest
