# Verify paimon-mosaic-core packaging and, only when authorized by release.yml,
# publish a final release to crates.io.
#
# Direct workflow_dispatch is always a dry run.
#
# Token auth: add secret CARGO_REGISTRY_TOKEN for crates.io publishing.

name: Release Rust

on:
  workflow_call:
    inputs:
      publish:
        description: Publish a final tag after all top-level release gates pass
        required: false
        type: boolean
        default: false
  workflow_dispatch:

concurrency:
  group: release-rust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate final publication authorization
        if: inputs.publish == true
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REPOSITORY" != "apache/paimon-mosaic" \
             || "$GITHUB_REF" != refs/tags/v* \
             || "$GITHUB_REF_NAME" == *-* ]]; then
            echo "Publication is allowed only for an authorized canonical final tag" >&2
            exit 1
          fi

      - name: Revalidate signed final tag before publication
        if: inputs.publish == true
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --show-error \
            --silent \
            https://downloads.apache.org/paimon/KEYS \
            --output "$RUNNER_TEMP/paimon-KEYS"
          python3 tools/validate_release_tag.py \
            "$TAG_NAME" \
            --keys-file "$RUNNER_TEMP/paimon-KEYS"

      - name: Verify release versions match the tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG_NAME#v}"
          version="${version%%-rc*}"
          python3 tools/verify_release_versions.py "$version"

      - name: Setup Rust toolchain
        run: |
          rustup update stable
          rustup default stable

      - name: Dry run
        shell: bash
        run: |
          set -euo pipefail
          package_files="$(cargo package -p paimon-mosaic-core --locked --list)"
          grep -qx Cargo.lock <<<"$package_files"
          grep -qx DEPENDENCIES.rust.tsv <<<"$package_files"
          grep -qx LICENSE <<<"$package_files"
          grep -qx NOTICE <<<"$package_files"
          cargo publish -p paimon-mosaic-core --locked --registry crates-io --dry-run

      - name: Publish paimon-mosaic-core to crates.io
        if: inputs.publish == true
        run: cargo publish -p paimon-mosaic-core --locked --registry crates-io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
