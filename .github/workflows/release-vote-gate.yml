name: Release Vote Gate

on:
  pull_request:
    branches: [main, "release-*"]
    paths:
      - ".gitattributes"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "ffi/Cargo.toml"
      - "jni/Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - "about.hbs"
      - "about.toml"
      - "docs/creating-a-release.html"
      - "docs/verifying-a-release-candidate.html"
      - "java/pom.xml"
      - "java/src/main/binary-resources/META-INF/LICENSE"
      - "java/src/main/binary-resources/META-INF/NOTICE"
      - "java/src/main/binary-resources/META-INF/licenses/*/THIRD-PARTY-LICENSES.html"
      - "java/src/test/java/org/apache/paimon/mosaic/MosaicNativeLoaderSmokeTest.java"
      - "python/licenses/*/LICENSE"
      - "python/licenses/*/NOTICE"
      - "python/licenses/*/THIRD-PARTY-LICENSES.html"
      - "python/pyproject.toml"
      - "python/setup.py"
      - "rust-toolchain.toml"
      - "tools/create_source_release.sh"
      - "tools/deploy_java_staging.sh"
      - "tools/generate_license_reports.py"
      - "tools/update_branch_version.sh"
      - "tools/verify_release_artifacts.py"
      - "tools/verify_release_versions.py"
      - "tools/verify_source_archive.py"
      - "tools/tests/test_create_source_release.py"
      - "tools/tests/deploy_java_staging_test.sh"
      - "tools/tests/test_generate_license_reports.py"
      - "tools/tests/test_python_setup.py"
      - "tools/tests/test_release_vote_workflow.py"
      - "tools/tests/test_update_branch_version.py"
      - "tools/tests/test_verify_release_artifacts.py"
      - "tools/tests/test_verify_release_versions.py"
      - "tools/tests/test_verify_source_archive.py"
  push:
    branches: [main, "release-*"]
    paths:
      - ".gitattributes"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "core/Cargo.toml"
      - "ffi/Cargo.toml"
      - "jni/Cargo.toml"
      - "Cargo.lock"
      - "LICENSE"
      - "NOTICE"
      - "about.hbs"
      - "about.toml"
      - "docs/creating-a-release.html"
      - "docs/verifying-a-release-candidate.html"
      - "java/pom.xml"
      - "java/src/main/binary-resources/META-INF/LICENSE"
      - "java/src/main/binary-resources/META-INF/NOTICE"
      - "java/src/main/binary-resources/META-INF/licenses/*/THIRD-PARTY-LICENSES.html"
      - "java/src/test/java/org/apache/paimon/mosaic/MosaicNativeLoaderSmokeTest.java"
      - "python/licenses/*/LICENSE"
      - "python/licenses/*/NOTICE"
      - "python/licenses/*/THIRD-PARTY-LICENSES.html"
      - "python/pyproject.toml"
      - "python/setup.py"
      - "rust-toolchain.toml"
      - "tools/create_source_release.sh"
      - "tools/deploy_java_staging.sh"
      - "tools/generate_license_reports.py"
      - "tools/update_branch_version.sh"
      - "tools/verify_release_artifacts.py"
      - "tools/verify_release_versions.py"
      - "tools/verify_source_archive.py"
      - "tools/tests/test_create_source_release.py"
      - "tools/tests/deploy_java_staging_test.sh"
      - "tools/tests/test_generate_license_reports.py"
      - "tools/tests/test_python_setup.py"
      - "tools/tests/test_release_vote_workflow.py"
      - "tools/tests/test_update_branch_version.py"
      - "tools/tests/test_verify_release_artifacts.py"
      - "tools/tests/test_verify_release_versions.py"
      - "tools/tests/test_verify_source_archive.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-vote-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install pytest PyYAML setuptools wheel

      - name: Verify generated license reports
        shell: bash
        env:
          CARGO_ABOUT_VERSION: "0.9.1"
        run: |
          set -euo pipefail
          cargo_about_root="${RUNNER_TEMP}/cargo-about"
          cargo install cargo-about \
            --version "${CARGO_ABOUT_VERSION}" \
            --locked \
            --features cli \
            --root "${cargo_about_root}"
          export PATH="${cargo_about_root}/bin:${PATH}"
          cargo fetch --locked
          python3 tools/generate_license_reports.py --check

      - name: Run release vote tests
        run: |
          python -m pytest -q \
            tools/tests/test_create_source_release.py \
            tools/tests/test_generate_license_reports.py \
            tools/tests/test_python_setup.py \
            tools/tests/test_release_vote_workflow.py \
            tools/tests/test_update_branch_version.py \
            tools/tests/test_verify_release_artifacts.py \
            tools/tests/test_verify_release_versions.py \
            tools/tests/test_verify_source_archive.py

      - name: Test local Java staging
        shell: bash
        run: bash tools/tests/deploy_java_staging_test.sh

      - name: Verify current source tree
        shell: bash
        run: |
          set -euo pipefail
          output_dir="$(mktemp -d "${RUNNER_TEMP}/source-tree.XXXXXX")"
          archive="${output_dir}/source.tgz"
          commit="$(git rev-parse --verify 'HEAD^{commit}')"
          prefix="paimon-mosaic-source-tree/"
          python3 tools/verify_source_archive.py create \
            --repository "${GITHUB_WORKSPACE}" \
            --commit "${commit}" \
            --prefix "${prefix}" \
            --output "${archive}"
          python3 tools/verify_source_archive.py verify \
            --repository "${GITHUB_WORKSPACE}" \
            --commit "${commit}" \
            --prefix "${prefix}" \
            --archive "${archive}"

      - name: Run static checks
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q \
            tools/generate_license_reports.py \
            tools/verify_release_artifacts.py \
            tools/verify_release_versions.py \
            tools/verify_source_archive.py \
            tools/tests/test_create_source_release.py \
            tools/tests/test_generate_license_reports.py \
            tools/tests/test_python_setup.py \
            tools/tests/test_release_vote_workflow.py \
            tools/tests/test_update_branch_version.py \
            tools/tests/test_verify_release_artifacts.py \
            tools/tests/test_verify_release_versions.py \
            tools/tests/test_verify_source_archive.py
          bash -n tools/create_source_release.sh
          bash -n tools/deploy_java_staging.sh
          bash -n tools/update_branch_version.sh
          bash -n tools/tests/deploy_java_staging_test.sh
          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            comparison_ref="origin/${GITHUB_BASE_REF}"
          else
            comparison_ref="HEAD^"
          fi
          git diff --check "$(git merge-base HEAD "${comparison_ref}")" HEAD
