# Orchestrate the full release. Directly dispatched leaf workflows are build-only.
# Registry publication is authorized only after the top-level preflight; Maven
# signing and Nexus staging remain explicit release-manager operations.

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-rc[0-9]+"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  tag-validation:
    name: Validate release tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate signed release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --show-error \
            --silent \
            https://downloads.apache.org/paimon/KEYS \
            --output "$RUNNER_TEMP/paimon-KEYS"
          python3 tools/validate_release_tag.py \
            "$TAG_NAME" \
            --keys-file "$RUNNER_TEMP/paimon-KEYS"

      - name: Confirm manual dispatch is build-only
        if: github.event_name == 'workflow_dispatch'
        run: echo "Manual dispatch runs all release verification without staging or publication."

  preflight:
    name: Release preflight
    needs: [tag-validation]
    uses: ./.github/workflows/ci.yml

  rust:
    name: Rust package verification
    needs: [preflight]
    uses: ./.github/workflows/release-rust.yml

  java:
    name: Java release verification
    needs: [preflight]
    uses: ./.github/workflows/release-java.yml

  python-wheels:
    name: Python wheels
    needs: [preflight]
    uses: ./.github/workflows/release-python.yml

  python-rc-publish:
    name: Publish RC wheels to TestPyPI
    needs: [rust, java, python-wheels]
    if: github.event_name == 'push' && github.repository == 'apache/paimon-mosaic' && startsWith(github.ref, 'refs/tags/') && contains(github.ref_name, '-rc')
    uses: ./.github/workflows/release-python-publish.yml
    with:
      publish_authorized: true
    secrets:
      TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}

  final-publication-preflight:
    name: Final publication preflight
    needs: [rust, java, python-wheels]
    if: github.event_name == 'push' && github.repository == 'apache/paimon-mosaic' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require promoted and valid ASF source release
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          archive="apache-paimon-mosaic-${version}-src.tgz"
          release_url="https://downloads.apache.org/paimon/paimon-mosaic-${version}"
          release_dir="$RUNNER_TEMP/source-release"
          mkdir -p "$release_dir"

          for file in "$archive" "$archive.asc" "$archive.sha512"; do
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --fail \
              --location \
              --retry 3 \
              --show-error \
              --silent \
              --output "$release_dir/$file" \
              "$release_url/$file"
          done

          checksum=""
          checksum_file=""
          extra_checksum_field=""
          read -r checksum checksum_file extra_checksum_field \
            < "$release_dir/$archive.sha512"
          checksum_file="${checksum_file#\*}"
          if [[ ! "$checksum" =~ ^[0-9A-Fa-f]{128}$ \
             || "$checksum_file" != "$archive" \
             || -n "$extra_checksum_field" \
             || "$(wc -l < "$release_dir/$archive.sha512")" -ne 1 ]]; then
            echo "Invalid SHA-512 file for promoted source release" >&2
            cat "$release_dir/$archive.sha512" >&2
            exit 1
          fi
          (
            cd "$release_dir"
            sha512sum --check "$archive.sha512"
          )

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --location \
            --retry 3 \
            --show-error \
            --silent \
            --output "$release_dir/KEYS" \
            https://downloads.apache.org/paimon/KEYS
          export GNUPGHOME="$RUNNER_TEMP/source-release-gpg"
          mkdir -m 700 "$GNUPGHOME"
          gpg --batch --no-tty --import "$release_dir/KEYS"
          gpg --batch --no-tty \
            --verify "$release_dir/$archive.asc" "$release_dir/$archive"

          python3 tools/verify_source_archive.py verify \
            --repository . \
            --commit "$GITHUB_SHA" \
            --prefix "paimon-mosaic-${version}/" \
            --archive "$release_dir/$archive"

      - name: Set up Rust toolchain for registry preflight
        run: |
          rustup update stable
          rustup default stable

      - name: Download final wheel artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist-final-preflight

      - name: Build and verify final registry artifacts
        id: registry_preflight
        env:
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          cargo package -p paimon-mosaic-core --locked --no-verify
          crate="target/package/paimon-mosaic-core-${version}.crate"
          test -f "$crate"

          shopt -s nullglob
          wheels=(dist-final-preflight/*.whl)
          if [[ "${#wheels[@]}" -eq 0 ]]; then
            echo "No final wheel artifacts were downloaded" >&2
            exit 1
          fi
          python3 tools/verify_python_wheels.py \
            --require-all-targets "${wheels[@]}"

          crates_response="$RUNNER_TEMP/crates-io-version.json"
          crates_status="$(
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --location \
              --retry 3 \
              --show-error \
              --silent \
              --user-agent 'Apache Paimon Mosaic release workflow' \
              --output "$crates_response" \
              --write-out '%{http_code}' \
              "https://crates.io/api/v1/crates/paimon-mosaic-core/${version}"
          )"
          crates_args=(
            crates-io
            --crate-name paimon-mosaic-core
            --version "$version"
            --artifact "$crate"
          )
          case "$crates_status" in
            200) crates_args+=(--version-json "$crates_response") ;;
            404) crates_args+=(--version-not-found) ;;
            *)
              cat "$crates_response" >&2
              echo "Unexpected crates.io response: HTTP ${crates_status}" >&2
              exit 1
              ;;
          esac
          crates_output="$RUNNER_TEMP/crates-registry-output"
          python3 tools/verify_registry_artifacts.py \
            "${crates_args[@]}" \
            --github-output "$crates_output"

          pypi_response="$RUNNER_TEMP/pypi-version.json"
          pypi_status="$(
            curl \
              --proto '=https' \
              --tlsv1.2 \
              --location \
              --retry 3 \
              --show-error \
              --silent \
              --output "$pypi_response" \
              --write-out '%{http_code}' \
              "https://pypi.org/pypi/paimon-mosaic/${version}/json"
          )"
          pypi_args=(
            pypi
            --project paimon-mosaic
            --version "$version"
            --wheel "${wheels[@]}"
          )
          case "$pypi_status" in
            200) pypi_args+=(--release-json "$pypi_response") ;;
            404) pypi_args+=(--release-not-found) ;;
            *)
              cat "$pypi_response" >&2
              echo "Unexpected PyPI response: HTTP ${pypi_status}" >&2
              exit 1
              ;;
          esac
          pypi_output="$RUNNER_TEMP/pypi-registry-output"
          python3 tools/verify_registry_artifacts.py \
            "${pypi_args[@]}" \
            --github-output "$pypi_output"

          crates_publish="$(sed -n 's/^publish=//p' "$crates_output")"
          pypi_publish="$(sed -n 's/^publish=//p' "$pypi_output")"
          if [[ ! "$crates_publish" =~ ^(true|false)$ \
             || ! "$pypi_publish" =~ ^(true|false)$ ]]; then
            echo "Registry preflight did not produce valid publication decisions" >&2
            exit 1
          fi
          echo "crates_publish=$crates_publish" >> "$GITHUB_OUTPUT"
          echo "pypi_publish=$pypi_publish" >> "$GITHUB_OUTPUT"

  rust-final-publish:
    name: Publish final Rust crate
    needs: [final-publication-preflight]
    uses: ./.github/workflows/release-rust.yml
    with:
      publish: true
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  python-final-publish:
    name: Publish final wheels to PyPI
    needs: [rust-final-publish]
    uses: ./.github/workflows/release-python-publish.yml
    with:
      publish_authorized: true
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
